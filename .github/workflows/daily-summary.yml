name: Daily Horizon Summary

on:
  schedule:
    # 北京时间早上 8:15 运行 (UTC 00:15)，预留时间确保 9:00 前送达
    - cron: '15 0 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
    
    # 👇 魔法开关：全局锁定北京时间
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      # 👇 测试期间封印抓取功能，不消耗 Token
      # - name: Run Horizon
      #   env:
      #     DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      #   run: uv run horizon --hours 1

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Send Above Briefing
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -c "
          import smtplib, os, glob, json, re, datetime
          from email.mime.text import MIMEText
          from email.header import Header

          today = datetime.datetime.now().strftime('%Y-%m-%d')

          with open('data/config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          
          # 1. 源到板块的映射
          source_to_cat = {src['name']: src.get('category', '国际') for src in config['sources']['rss']}

          # 2. 寻找真实的中英文文件
          zh_files = glob.glob('data/summaries/horizon-*-zh.md')
          en_files = glob.glob('data/summaries/horizon-*-en.md')
          
          if not zh_files:
              print('❌ 未找到真实中文简报文件！请确保 Run Horizon 已经跑过。')
              exit(1)
              
          latest_zh = max(zh_files, key=os.path.getctime)
          with open(latest_zh, 'r', encoding='utf-8') as f:
              content_zh = f.read()

          content_en = ''
          if en_files:
              latest_en = max(en_files, key=os.path.getctime)
              with open(latest_en, 'r', encoding='utf-8') as f:
                  content_en = f.read()

          # 3. 超强解析器
          def parse_md(content):
              items = []
              current = None
              for line in content.split('\n'):
                  line = line.strip()
                  # 匹配标题：### [Title](URL)
                  match = re.search(r'### \[(.*?)\]\((.*?)\)', line)
                  if match:
                      if current: items.append(current)
                      current = {'title': match.group(1), 'url': match.group(2), 'summary': '', 'source': ''}
                      continue
                      
                  # 匹配媒体源：rss · The Guardian · Oct 26
                  if line.startswith('rss · ') and current and not current['source']:
                      parts = line.split('·')
                      if len(parts) >= 2:
                          current['source'] = parts[1].strip()
                      continue
                      
                  # 提取摘要（跳过 Background 和 References）
                  if current and not current['summary'] and line and not line.startswith('#') and not line.startswith('**') and not line.startswith('>') and not line.startswith('<'):
                      if len(line) > 20:
                          current['summary'] = line[:120] + '...'
                          
              if current: items.append(current)
              return items

          zh_news = parse_md(content_zh)
          en_news = {item['url']: item for item in parse_md(content_en)} if content_en else {}

          # 4. 按板块分类
          categorized_news = {'国内': [], '国际': [], 'AI领域': []}
          
          for item in zh_news:
              # 尝试匹配源，匹配不到默认国际
              cat = '国际'
              for src_name, src_cat in source_to_cat.items():
                  if src_name.lower() in item['source'].lower() or item['source'].lower() in src_name.lower():
                      cat = src_cat
                      break
              
              if cat not in categorized_news:
                  categorized_news[cat] = []
                  
              # 每个板块最多 3 条
              if len(categorized_news[cat]) < 3:
                  # 找对应的英文
                  en_item = en_news.get(item['url'])
                  categorized_news[cat].append({'zh': item, 'en': en_item})

          # 5. 拼接双语 HTML 邮件
          web_link = f'https://angusamurai.github.io/ABOVE_Horizon/'
          
          html_content = f'<div style=\"font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; color: #333;\">'
          html_content += f'<h2 style=\"border-bottom: 2px solid #eaeaea; padding-bottom: 10px;\">🌊 Above Daily Digest</h2>'
          html_content += f'<p style=\"color: #666; font-size: 14px;\">Stay informed, stay above water.</p>'
          
          for cat in ['国内', '国际', 'AI领域']:
              if categorized_news.get(cat):
                  html_content += f'<h3 style=\"color: #2ea44f; margin-top: 25px;\">📍 {cat}</h3>'
                  html_content += '<ul style=\"padding-left: 20px;\">'
                  for pair in categorized_news[cat]:
                      zh, en = pair['zh'], pair['en']
                      html_content += f'<li style=\"margin-bottom: 20px;\">'
                      html_content += f'<strong style=\"font-size: 16px;\">{zh[\"title\"]}</strong><br>'
                      html_content += f'<span style=\"color: #444; font-size: 14px;\">{zh[\"summary\"]}</span>'
                      
                      if en:
                          html_content += f'<br><br><strong style=\"font-size: 14px; color: #888;\">{en[\"title\"]}</strong><br>'
                          html_content += f'<span style=\"color: #999; font-size: 13px;\">{en[\"summary\"]}</span>'
                          
                      html_content += f'</li>'
                  html_content += '</ul>'
          
          html_content += f'<div style=\"text-align: center; margin: 30px 0;\">'
          html_content += f'<a href=\"{web_link}\" style=\"background-color: #2ea44f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;\">👉 阅读完整双语网页版</a>'
          html_content += f'</div></div>'

          # 6. 发送邮件
          msg = MIMEText(html_content, 'html', 'utf-8')
          msg['Subject'] = Header(f'[{today}] Above Daily Digest', 'utf-8')
          msg['From'] = 'angusw@foxmail.com'
          msg['To'] = 'anguswym@outlook.com'

          try:
              server = smtplib.SMTP_SSL('smtp.qq.com', 465)
              server.login('angusw@foxmail.com', os.environ['EMAIL_PASSWORD'])
              server.sendmail('angusw@foxmail.com', ['anguswym@outlook.com'], msg.as_string())
              print('✅ 完美中英双语简报发送成功！')
              server.quit()
          except Exception as e:
              print('❌ 发送失败：', e)
          "
