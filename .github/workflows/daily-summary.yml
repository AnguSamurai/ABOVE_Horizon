name: Daily Horizon Summary

on:
  schedule:
    # 北京时间早上 8:15 运行 (UTC 00:15)，预留时间确保 9:00 前送达
    - cron: '15 0 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
    
    # 👇 魔法开关：全局锁定北京时间
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      # 👇 测试期间封印抓取功能，不消耗 Token
      # - name: Run Horizon
      #   env:
      #     DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      #   run: uv run horizon --hours 1

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Send Above Briefing
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -c "
          import smtplib, os, glob, json, re, datetime
          from email.mime.text import MIMEText
          from email.header import Header

          # 👇 强制获取北京时间
          today = datetime.datetime.now().strftime('%Y-%m-%d')

          with open('data/config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          source_to_cat = {src['name']: src.get('category', '综合') for src in config['sources']['rss']}

          files = glob.glob('data/summaries/horizon-*-en.md')
          if not files:
              print('❌ 没有找到生成的简报文件！')
              exit(1)
          latest_file = max(files, key=os.path.getctime)
          with open(latest_file, 'r', encoding='utf-8') as f:
              content = f.read()

          categorized_news = {}
          blocks = re.split(r'\n(?=##+ )', content)
          
          for block in blocks:
              lines = block.strip().split('\n')
              if not lines: continue
              
              title = lines[0].lstrip('#').strip()
              if not title or 'Horizon' in title: continue
                  
              source = ''
              for src_name in source_to_cat.keys():
                  if src_name in block:
                      source = src_name
                      break
              
              category = source_to_cat.get(source, '国际')
              
              summary = ''
              for line in lines[1:]:
                  line = line.strip()
                  if line and not line.startswith('Source') and not line.startswith('['):
                      summary = line[:120] + '...'
                      break
              
              if summary:
                  if category not in categorized_news:
                      categorized_news[category] = []
                  if len(categorized_news[category]) < 2:
                      categorized_news[category].append((title, summary))

          # 生成纯北京时间的网页路径
          date_path = today.replace('-', '/')
          web_link = f'https://angusamurai.github.io/ABOVE_Horizon/{date_path}/summary-en.html'
          
          html_content = f'<div style=\"font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; color: #333;\">'
          html_content += f'<h2 style=\"border-bottom: 2px solid #eaeaea; padding-bottom: 10px;\">🌊 Above Daily Digest</h2>'
          
          for cat, news_list in categorized_news.items():
              html_content += f'<h3 style=\"color: #2ea44f; margin-top: 20px;\">📍 {cat}</h3>'
              html_content += '<ul style=\"padding-left: 20px;\">'
              for title, summary in news_list:
                  html_content += f'<li style=\"margin-bottom: 15px;\"><strong>{title}</strong><br><span style=\"color: #666; font-size: 14px;\">{summary}</span></li>'
              html_content += '</ul>'
          
          html_content += f'<div style=\"text-align: center; margin: 30px 0;\">'
          html_content += f'<a href=\"{web_link}\" style=\"background-color: #2ea44f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;\">👉 阅读完整双语网页版</a>'
          html_content += f'</div></div>'

          msg = MIMEText(html_content, 'html', 'utf-8')
          msg['Subject'] = Header(f'[{today}] Above Daily Digest', 'utf-8')
          msg['From'] = 'angusw@foxmail.com'
          msg['To'] = 'anguswym@outlook.com'

          try:
              server = smtplib.SMTP_SSL('smtp.qq.com', 465)
              server.login('angusw@foxmail.com', os.environ['EMAIL_PASSWORD'])
              server.sendmail('angusw@foxmail.com', ['anguswym@outlook.com'], msg.as_string())
              print('✅ 按板块分类的极简简报发送成功！')
              server.quit()
          except Exception as e:
              print('❌ 发送失败：', e)
          "
