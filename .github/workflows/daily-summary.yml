name: Daily Horizon Summary

on:
  schedule:
    # 北京时间早上 8:15 运行 (UTC 00:15)，预留时间确保 9:00 前送达
    - cron: '15 0 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
    
    # 👇 魔法开关：全局锁定北京时间
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      # 👇 测试期间封印抓取功能，不消耗 Token
      # - name: Run Horizon
      #   env:
      #     DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      #   run: uv run horizon --hours 1

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Send Above Briefing
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -c "
          import smtplib, os, glob, json, re, datetime
          from email.mime.text import MIMEText
          from email.header import Header

          # 强制获取北京时间
          today = datetime.datetime.now().strftime('%Y-%m-%d')

          with open('data/config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          source_to_cat = {src['name']: src.get('category', '综合') for src in config['sources']['rss']}

          # 1. 分别寻找中英文文件
          zh_files = glob.glob('data/summaries/horizon-*-zh.md')
          en_files = glob.glob('data/summaries/horizon-*-en.md')
          
          # 假数据兜底（双语版）
          fake_zh = '''
          ## 测试中文标题一
          Source: 测试媒体
          这是一条用来测试排版和网页链接的中文假新闻摘要。

          ## 测试中文标题二
          Source: 测试媒体
          这是第二条中文测试新闻。
          '''
          fake_en = '''
          ## Test English Title One
          Source: Test Media
          This is a fake English summary for layout testing.
          '''
          
          if not zh_files or not en_files:
              print('⚠️ 未找到真实简报文件，正在使用【双语测试假数据】生成邮件...')
              content_zh = fake_zh
              content_en = fake_en
          else:
              latest_zh = max(zh_files, key=os.path.getctime)
              latest_en = max(en_files, key=os.path.getctime)
              with open(latest_zh, 'r', encoding='utf-8') as f:
                  content_zh = f.read()
              with open(latest_en, 'r', encoding='utf-8') as f:
                  content_en = f.read()

          # 2. 解析文本的通用函数
          def parse_blocks(content):
              news_dict = {}
              blocks = re.split(r'\n(?=##+ )', content)
              for block in blocks:
                  lines = block.strip().split('\n')
                  if not lines: continue
                  
                  title = lines[0].lstrip('#').strip()
                  if not title or 'Horizon' in title: continue
                      
                  source = ''
                  for src_name in source_to_cat.keys():
                      if src_name in block:
                          source = src_name
                          break
                  
                  summary = ''
                  for line in lines[1:]:
                      line = line.strip()
                      if line and not line.startswith('Source') and not line.startswith('['):
                          summary = line[:120] + '...'
                          break
                  
                  if summary:
                      news_dict[title] = {'source': source, 'summary': summary}
              return news_dict

          zh_news = parse_blocks(content_zh)
          en_news = parse_blocks(content_en)

          # 3. 拼接双语 HTML 邮件正文
          date_path = today.replace('-', '/')
          web_link = f'https://angusamurai.github.io/ABOVE_Horizon/{date_path}/summary-en.html'
          
          html_content = f'<div style=\"font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; color: #333;\">'
          html_content += f'<h2 style=\"border-bottom: 2px solid #eaeaea; padding-bottom: 10px;\">🌊 Above Daily Digest</h2>'
          
          # 因为假数据是独立的，如果是真数据，顺序一般是对应的。这里简化处理，直接按板块展示前两条。
          # 如果是真实数据，中文和英文的 key 可能不完全一致，这里我们优先展示能匹配到的。
          
          for cat, _ in source_to_cat.items():
              html_content += f'<h3 style=\"color: #2ea44f; margin-top: 20px;\">📍 {cat}</h3>'
              html_content += '<ul style=\"padding-left: 20px;\">'
              count = 0
              for title_zh, data in zh_news.items():
                  if data['source'] in [k for k, v in source_to_cat.items() if v == cat]:
                      # 找对应的英文（简单模糊匹配，或者直接展示）
                      title_en = 'English Translation'
                      summary_en = 'Please view the web version for full bilingual content.'
                      # 如果有真实的英文数据，就替换
                      for t_en, d_en in en_news.items():
                          if d_en['source'] == data['source']:
                              title_en = t_en
                              summary_en = d_en['summary']
                              break
                              
                      html_content += f'<li style=\"margin-bottom: 20px;\">'
                      html_content += f'<strong style=\"font-size: 16px;\">{title_zh}</strong><br>'
                      html_content += f'<span style=\"color: #444; font-size: 14px;\">{data[\"summary\"]}</span><br><br>'
                      html_content += f'<strong style=\"font-size: 14px; color: #666;\">{title_en}</strong><br>'
                      html_content += f'<span style=\"color: #888; font-size: 13px;\">{summary_en}</span>'
                      html_content += f'</li>'
                      count += 1
                      if count >= 2: break
              html_content += '</ul>'
          
          html_content += f'<div style=\"text-align: center; margin: 30px 0;\">'
          html_content += f'<a href=\"{web_link}\" style=\"background-color: #2ea44f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;\">👉 阅读完整双语网页版</a>'
          html_content += f'</div></div>'

          # 4. 发送邮件
          msg = MIMEText(html_content, 'html', 'utf-8')
          msg['Subject'] = Header(f'[{today}] Above Daily Digest', 'utf-8')
          msg['From'] = 'angusw@foxmail.com'
          msg['To'] = 'anguswym@outlook.com'

          try:
              server = smtplib.SMTP_SSL('smtp.qq.com', 465)
              server.login('angusw@foxmail.com', os.environ['EMAIL_PASSWORD'])
              server.sendmail('angusw@foxmail.com', ['anguswym@outlook.com'], msg.as_string())
              print('✅ 双语极简简报发送成功！')
              server.quit()
          except Exception as e:
              print('❌ 发送失败：', e)
          "
