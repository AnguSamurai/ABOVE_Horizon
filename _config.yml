theme: jekyll-theme-cayman
title: Above Daily
description: Stay informed, stay above water.
baseurl: "/ABOVE_Horizon" # 👈 这里必须改成你的仓库名，前面要带斜杠
url: "https://angusamurai.github.io" # 👈 这里改成你的 GitHub 用户名主页

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
